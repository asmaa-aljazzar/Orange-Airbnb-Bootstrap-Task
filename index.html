<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Airbnb</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header>
        <!-- Start Navbar -->
        <nav class="navbar-wrapper fixed-top bg-white">

            <!-- Main navbar -->
            <div class="container-fluid navbar-main">

                <a class="navbar-brand" href="#">
                    <img src="./images/Airbnb_Logo_Bélo.svg.webp" alt="Logo">
                </a>

                <!-- Categories -->
                <div class="categories d-flex gap-4">
                    <a href="#"><img src="./images/earth_image.png" alt=""><span> All</span></a>
                    <a href="#"><img src="./images/house.png" alt=""><span>Homes</span></a>
                    <a href="#"><img src="./images/air-ballone.png" alt=""><span>Experiences</span></a>
                    <a href="#"><img src="./images/ring.png" alt=""><span>Services</span></a>
                </div>

                <!-- Right side -->
                <div class="d-flex align-items-center gap-3">
                    <span>Become a host</span>
                    <button><img src="./images/web.svg" alt=""></button>
                    <button><img src="./images/toggle.svg" alt=""></button>
                </div>

            </div>


            <!-- Large search -->
            <div class="large-search">
                <div>Where<br><span>Search destinations</span></div>
                <div>When<br><span>Add dates</span></div>
                <div>Who<br><span>Add guests</span></div>
                <button><img src="./images/search.svg" alt=""></button>
            </div>


            <!-- Compact search -->
            <div class="compact-search">
                <img src="./images/house.png" alt="">
                <span><strong>Anywhere</strong></span>
                <span>Anytime</span>
                <span>Add guests</span>
                <button><img src="./images/search.svg" alt=""></button>
            </div>

        </nav>
        <!-- End Navbar -->
    </header>

    <main>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
